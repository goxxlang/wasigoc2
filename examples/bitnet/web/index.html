<style>

  try { ev = JSON.parse(line); } catch { return; }
  if (ev.ev === "progress") setProgress(Number(ev.p) || 0, "upload");
  else if (ev.ev === "ready") {
    flow.ready(ev.flow);
    ctxMax = Number(ev.model && ev.model.ctx) || 0;
    ctxPos = 0;
    updateCtx();
    onReady();
  }
  else if (ev.ev === "flow") {
    try { flow.frame(ev); } catch (e) { console.error(e); notice(e.message); }
  }
  else if (ev.ev === "token") onToken(ev);
  else if (ev.ev === "done") onDone(ev);
  else if (ev.ev === "reset" && silentReset) {
    const done = silentReset;
    silentReset = null;
    ctxPos = 0;
    updateCtx();
    done();
  }
  else if (ev.ev === "notice" && /context is full/i.test(ev.msg || "") && chatId && !compacting && lastChatCmd) {
    recoverFull(lastChatCmd);
  }
  else if (ev.ev === "reset") {
    assistant = null;
    rawAnswer = "";
    toolRounds = 0;
    replaceNext = false;
    hidingTool = false;
    afterPlain = null;
    lastAsk = "";
    pendingLearn = "";
    welcome();
    status("Ready", "ready");
    setBusy(false);
  }
  else if (ev.ev === "notice") {
    // A refused turn never sends done: release a summary turn that waits on it.
    if (afterPlain) {
      const cb = afterPlain;
      afterPlain = null;
      cb(null);
    }
    notice(ev.msg || "That message was not run.");
  }
  else if (ev.ev === "error") {
    if (swapping) {
      const s = swapping;
      swapping = null;
      s.reject(new Error(ev.msg || "the model stopped"));
    }
    status("Stopped", "fail");
    notice(ev.msg || shownName() + " stopped.");
    setBusy(false);
    ready = false;
  }
}
function onOut(text) {
  lineBuf += text;
  let nl;
  while ((nl = lineBuf.indexOf("\n")) >= 0) {
    const line = lineBuf.slice(0, nl).trim();
    lineBuf = lineBuf.slice(nl + 1);
    if (line) onEvent(line);
  }
}

let worker = null;
function start(files) {
  if (worker) worker.terminate();
  ready = false;
  generating = false;
  assistant = null;
  lineBuf = "";
  stopByte[0] = 0;
  Atomics.store(i32, 0, 0);
  Atomics.store(i32, 1, 0);
  if (!swapping) showLoading("Starting " + shownName() + ".");
  shownMax = 0;
  sawDownload = false;
  $("bar-fill").style.width = "0%";
  status("Starting", "busy");
  $("stop").hidden = true;
  $("msg").disabled = true;
  $("send").disabled = true;
  $("think").disabled = true;
  $("plus").disabled = true;
  $("newchat").disabled = true;
  files.stop = { sab: stopSab, off: 0, size: 1 };
  const args = [
    "bitnet.wasm", "-model", "model", "-kernels", "kernels",
    "-ui", "-stop", "stop", "-system", SYSTEM,
  ];
  flow.wire(files, args);
  worker = new Worker(new URL("champ-worker.js", here), { type: "module" });
  worker.onmessage = (e) => {
    const m = e.data || {};
    if (m.type === "worker-ready") {
      worker.postMessage({ type: "boot", wasm: new URL("bitnet.wasm", here).href, args, files, sab });
      status("Starting", "busy");
    } else if (m.type === "progress") setProgress(Number(m.p) || 0, "download");
    else if (m.type === "out") onOut(m.text || "");
    else if (m.type === "err" && m.text && m.text.trim()) {
      console.error(m.text);
      const line = m.text.trim().split("\n")[0].slice(0, 200);
      if (!ready) showLoading(line);
      notice(shownName() + " ran into a problem.");
    }
    else if (m.type === "exit") {
      if (swapping) {
        const s = swapping;
        swapping = null;
        s.reject(new Error("the model stopped while loading"));
      }
      if (lineBuf.trim()) onEvent(lineBuf.trim());
      lineBuf = "";
      if (statusText.textContent !== "Stopped") status("Session ended", "fail");
      ready = false;
      setBusy(false);
      $("msg").disabled = true;
      $("send").disabled = true;
      $("think").disabled = true;
      $("plus").disabled = true;
    }
  };
  worker.onerror = (e) => {
    if (swapping) {
      const s = swapping;
      swapping = null;
      s.reject(new Error(e.message || "the runtime failed to start"));
    }
    status("Stopped", "fail");
    notice(e.message || "The runtime failed to start.");
  };
}

async function go(make) {
  try {
    if (!crossOriginIsolated) throw new Error("Open " + shownName() + " from Encryptid so it can start.");
    if (!navigator.gpu) throw new Error("This browser cannot run " + shownName() + ".");
    status("Preparing", "busy");
    showLoading("Preparing " + shownName() + ".");
    const files = await make();
    Object.assign(files, await kernels());
    start(files);
  } catch (e) {
    status("Unavailable", "fail");
    $("loading-copy").textContent = e && e.message ? e.message : String(e);
    showLoading($("loading-copy").textContent);
  }
}

function plainChat(text, max) {
  return new Promise((resolve) => {
    afterPlain = (visible) => resolve(visible);
    held = "";
    holding = true;
    hidingTool = false;
    rawAnswer = "";
    if (!command({ op: "chat", text, system: SYSTEM, max })) {
      afterPlain = null;
      resolve(null);
    }
  });
}
function answerParts() {
  const row = document.createElement("div");
  row.className = "msg assistant";
  const box = document.createElement("div");
  box.className = "bubble";
  const who = document.createElement("span");
  who.className = "who";
  whoLabel(who, undefined);
  const thoughts = document.createElement("div");
  thoughts.className = "thoughts";
  const body = document.createElement("div");
  box.append(who, thoughts, body);
  row.append(box);
  thread.append(row);
  thread.parentElement.scrollTop = thread.parentElement.scrollHeight;
  return { thoughts, body };
}
async function deepThink(question) {
  const parts = answerParts();
  const lines = [];
  const id = String(mind.head() + 1);
  for (let step = 1; step <= 3; step++) {
    if (stopByte[0]) break;
    status("Thinking", "busy");
    const live = document.createElement("div");
    parts.thoughts.append(live);
    assistant = live;
    const got = await plainChat(thoughtPrompt(step, question, lines.join(" ")), 64);
    if (got == null) {
      if (!lines.length) notice("That message is too long for one turn.");
      break;
    }
    if (stopByte[0]) break;
    const sentence = got.replace(/\s+/g, " ").trim();
    if (!sentence) {
      live.remove();
      continue;
    }
    live.textContent = step + ". " + sentence;
    mind.commit("think", id + "/" + step, sentence.slice(0, 700));
    lines.push(sentence);
  }
  assistant = parts.body;
  if (stopByte[0] || !lines.length) {
    finishTurn(lastDone);
    return;
  }
  status("Thinking", "busy");
  const notes = mind.recall(question);
  const got = await plainChat(explainPrompt(question, lines, notes), 256);
  const answer = (got || "").trim();
  if (!stopByte[0] && answer && !offerLearn(question, answer)) {
    mind.learn(question, answer);
  }
  finishTurn(lastDone);
}
function offerLearn(question, said) {
  if (!question || !unknownReply(said)) return false;
  if (asksClock(question) && !wantsLookup(question) && !wantsTeach(question)) return false;
  if (assistant) assistant.textContent = "Would you like me to learn this?";
  pendingLearn = question;
  return true;
}
async function fromModelTool(t, q, learn) {
  assistant = bubble("assistant", "");
  const beat = route(ctxFull(), KIND.tool);
  if (accept(KIND.tool, { busy: true, loading: !ready || !!swapping, queue: beats.length }) === "take") {
    showLoad(assistant, learn ? "Learning…" : "Searching…", "", beat);
  }
  status(learn ? "Learning…" : "Searching…", "busy");
  let ran = { output: "" };
  try { ran = await runTool({ tool: "search", args: { q } }); }
  catch { ran = { output: "" }; }
  if (stopByte[0]) {
    finishTurn(null);
    return;
  }
  if (!ran.output || ran.output === "The lookup failed." || ran.output === "Missing search query.") {
    assistant.textContent = learn ? shownName() + " could not learn that." : "The lookup failed.";
    finishTurn(null);
    return;
  }
  if (learn) {
    mind.learn(q, ran.output);
  }
  let wire = "Results:\n" + ran.output + "\nThe person asked: " + t + "\nAnswer the person in plain words. Do not use JSON.";
  const note = learn ? "" : mind.recall(t);
  if (note) wire = "Notes:\n" + note + "\n" + wire;
  assistant.textContent = "";
  held = "";
  holding = true;
  hidingTool = false;
  rawAnswer = "";
  status("Thinking", "busy");
  if (!command({ op: "chat", text: wire, system: SYSTEM })) {
    assistant.textContent = ran.output;
    finishTurn(null);
  }
}
// opts.from: an edited message replaces seq `from` and everything after it.
// opts.regen: answer the user message at that seq again.
async function ask(text, opts) {
  const o = opts || {};
  const t = text.trim();
  if (!t) return;
  turnPresence = presenceOf(t, { think: thinkOn });
  turnMix = mixOf(t, { think: thinkOn });
  if (accept(KIND.chat, { busy: generating || compacting, loading: !ready || !!swapping, queue: beats.length }) === "stall") {
    if (ready && beats.length < DEPTH) beats.push([text, opts]);
    return;
  }
  if (!chatId) {
    chatId = chats.create(t);
    setHash(chatId);
    if (thread.querySelector(".chips")) thread.textContent = "";
  }
  let userSeq;
  if (o.regen != null) {
    chats.truncate(chatId, o.regen + 1);
    primedId = null;
    userSeq = o.regen;
    showChat(chatId);
  } else {
    if (o.from != null) {
      chats.truncate(chatId, o.from);
      primedId = null;
      showChat(chatId);
    }
    userSeq = chats.add(chatId, { role: "user", text: t });
    userRow(t, userSeq);
  }
  noteUrls(t);
  refreshList();
  toEnd();
  stopByte[0] = 0;
  toolRounds = 0;
  replaceNext = false;
  hidingTool = false;
  status("Thinking", "busy");
  setBusy(true);
  // /run, /notes, /note, /task, /tasks, /done, /canvas: the tool runs as typed.
  const direct = slashCall(text);
  if (direct) {
    pendingLearn = "";
    status(toolStatus(direct.tool).replace("…", ""), "busy");
    let ran;
    try { ran = await runAgent(direct); } catch { ran = { output: "The tool failed.", exit_code: 1 }; }
    addCard({ tool: direct.tool, args: direct.args, output: ran.output, exit_code: ran.exit_code, data: ran.data || null });
    finishTurn(null);
    return;
  }
  // The router (router.js): the gate picks this message's engine and the tools it needs. A different
  // model than the loaded one is a hand-off that carries the continuity chain.
  const d = decide({ text: t, mode, models, loaded: modelId, think: thinkOn, picks: [...picks] });
  if (d.model && d.swap && !(await handoff(d.model, d.reason))) d.think = thinkOn;
  const on = modelOf(modelId);
  turnVia = on ? { id: on.id, name: on.name, tier: on.tier || "", label: engineOf(on) && mode === "auto" ? engineOf(on).label : on.name, reason: on.id === (d.model && d.model.id) ? d.reason : "" } : null;
  status("Thinking", "busy");
  await prime(t, userSeq);
  if (pendingLearn && acceptsLearn(t)) {
    const q = pendingLearn;
    pendingLearn = "";
    lastAsk = q;
    await fromModelTool(q, q, true);
    return;
  }
  if (pendingLearn && declinesLearn(t)) {
    pendingLearn = "";
    assistant = bubble("assistant", "Okay.");
    finishTurn(null);
    return;
  }
  pendingLearn = "";
  lastAsk = t;
  const chosen = d.tools;
  // Search alone runs the search on the message; other picks tell the model which tool to call.
  if (chosen.length === 1 && chosen[0] === "search") {
    await fromModelTool(t, lookupQuery(t), false);
    return;
  }
  if (!chosen.length && (wantsTeach(t) || wantsLookup(t))) {
    const learn = wantsTeach(t);
    await fromModelTool(t, learn ? teachQuery(t) : lookupQuery(t), learn);
    return;
  }
  if (d.think && !chosen.length) {
    deepThink(t).catch(() => {
      notice(shownName() + " ran into a problem.");
      finishTurn(null);
    });
    return;
  }
  assistant = bubble("assistant", "");
  held = "";
  holding = true;
  rawAnswer = "";
  let wire = asksClock(t) ? ("Current local time: " + clockText() + "\n" + t) : t;
  const hint = pickedHint(chosen);
  if (hint) wire = hint + "\n" + wire;
  const note = mind.recall(t);
  if (note) wire = "Notes:\n" + note + "\n" + wire;
  if (!command({ op: "chat", text: wire, system: SYSTEM })) {
    notice("That message is too long for one turn.");
    setBusy(false);
  }
}

$("newchat").onclick = () => newChat();
$("chat-search").addEventListener("input", () => refreshList());
function closeDrawer() {
  $("side").classList.remove("open");
  $("scrim").hidden = true;
  $("menu").setAttribute("aria-expanded", "false");
}
$("menu").onclick = () => {
  const open = !$("side").classList.contains("open");
  $("side").classList.toggle("open", open);
  $("scrim").hidden = !open;
  $("menu").setAttribute("aria-expanded", open ? "true" : "false");
};
$("scrim").onclick = closeDrawer;
thread.parentElement.addEventListener("scroll", () => { $("to-end").hidden = nearEnd() || thread.hidden; });
$("to-end").onclick = () => { toEnd(); $("to-end").hidden = true; };
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && editFrom != null) {
    editFrom = null;
    $("msg").value = "";
    $("msg").placeholder = "Message " + shownName();
  }
});
refreshList();
$("stop").onclick = () => { stopByte[0] = 1; status("Stopping", "busy"); };
$("think").onclick = () => {
  thinkOn = !thinkOn;
  $("think").setAttribute("aria-pressed", thinkOn ? "true" : "false");
};
// + : tools the person picks stay chosen for the next messages until removed.
const picks = new Set();
function closeTools() {
  $("tool-menu").hidden = true;
  $("plus").setAttribute("aria-expanded", "false");
}
function renderPicks() {
  for (const b of $("tool-menu").children) b.setAttribute("aria-checked", picks.has(b.dataset.tool) ? "true" : "false");
  const box = $("picked");
  box.textContent = "";
  for (const p of PICKS) {
    if (!picks.has(p.tool)) continue;
    const chip = document.createElement("button");
    chip.type = "button";
    chip.textContent = p.label + " ×";
    chip.setAttribute("aria-label", "Stop using " + p.label);
    chip.onclick = () => { picks.delete(p.tool); renderPicks(); $("msg").focus(); };
    box.append(chip);
  }
  box.hidden = !picks.size;
}
for (const p of PICKS) {
  const b = document.createElement("button");
  b.type = "button";
  b.setAttribute("role", "menuitemcheckbox");
  b.dataset.tool = p.tool;
  b.textContent = p.label;
  b.onclick = () => {
    if (picks.has(p.tool)) picks.delete(p.tool);
    else picks.add(p.tool);
    renderPicks();
  };
  $("tool-menu").append(b);
}
renderPicks();
$("plus").onclick = () => {
  const open = $("tool-menu").hidden;
  $("tool-menu").hidden = !open;
  $("plus").setAttribute("aria-expanded", open ? "true" : "false");
  if (open) $("tool-menu").firstElementChild.focus();
};
document.addEventListener("click", (e) => {
  if (!$("tool-menu").hidden && !e.target.closest(".tool-pick")) closeTools();
});
$("tool-menu").addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeTools(); $("plus").focus(); }
});
$("chat").onsubmit = (e) => {
  e.preventDefault();
  const t = $("msg").value;
  if (!t.trim() || !ready || generating || compacting) return;
  $("msg").value = "";
  $("msg").style.height = "auto";
  $("msg").placeholder = "Message " + shownName();
  const from = editFrom;
  editFrom = null;
  ask(t, from != null ? { from } : undefined);
};
$("msg").addEventListener("input", () => {
  $("msg").style.height = "auto";
  $("msg").style.height = Math.min(160, $("msg").scrollHeight) + "px";
});
$("msg").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("chat").requestSubmit();
  }
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
go(async () => fromUrl(await pickModel()));
