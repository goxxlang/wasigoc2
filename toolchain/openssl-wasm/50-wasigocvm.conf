# OpenSSL 3 target for wasigocvm (wasm32 + our sysroot libc).
# Loaded via OPENSSL_LOCAL_CONFIG_DIR from toolchain/build_openssl_wasm.sh.
# Same OpenSSL the native ~/WASMLime libdatachannel TlsTransport already
# uses — this is the wasm build of that stack, not a handshake rewrite.

my %targets = (
    "wasm32-wasigocvm" => {
        inherit_from     => [ "BASE_unix" ],
        CC               => "clang",
        CXX              => "clang++",
        AR               => "llvm-ar",
        ARFLAGS          => "qs",
        RANLIB           => "llvm-ranlib",
        CFLAGS           => picker(default => "-Wall",
                                   debug   => "-O0 -g",
                                   release => "-O2"),
        CXXFLAGS         => picker(default => "-Wall",
                                   debug   => "-O0 -g",
                                   release => "-O2"),
        lib_cppflags     => add("-DL_ENDIAN -DOPENSSL_SMALL_FOOTPRINT"),
        bn_ops           => "BN_LLONG RC4_CHAR",
        thread_scheme    => "(unknown)",
        perlasm_scheme   => "void",
        sys_id           => "WASI",
        disable          => add("afalgeng"),
        unistd           => "<unistd.h>",
    },
);
